# keeps free hosts from spinning down.
# repo settings -> secrets -> actions -> PING_URLS = "https://a.hf.space,https://b.onrender.com"
# free tiers sleep after 15 min (render) / 48 h (hf); a 10 min ping holds both.
# note: github cron is best-effort — it can drift 5-15 min and pauses after 60 days
# of repo inactivity. pair it with uptimerobot (free, 5 min, no card) for real 24/7.
name: keepalive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: ping every url
        env:
          URLS: ${{ secrets.PING_URLS }}
        run: |
          set -u
          [ -n "${URLS:-}" ] || { echo "PING_URLS secret is empty — nothing to ping"; exit 0; }
          fail=0
          IFS=',' read -ra LIST <<< "$URLS"
          for raw in "${LIST[@]}"; do
            url="$(echo "$raw" | xargs)"
            [ -n "$url" ] || continue
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 --retry 2 --retry-delay 5 "$url/api/health" || echo 000)"
            echo "$code  $url"
            case "$code" in 200) ;; *) fail=1 ;; esac
          done
          exit $fail
